<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="800" height="80">
  <defs>
    <linearGradient id="darkPrism" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#b06800">
        <animate attributeName="stop-color" 
                 values="#b06800; #ffd700; #fff4b0; #e8a800; #b06800" 
                 dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#fff4b0">
        <animate attributeName="stop-color" 
                 values="#fff4b0; #e8a800; #b06800; #ffd700; #fff4b0" 
                 dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#b06800">
        <animate attributeName="stop-color" 
                 values="#b06800; #ffd700; #fff4b0; #e8a800; #b06800" 
                 dur="4s" repeatCount="indefinite" />
      </stop>
      
    </linearGradient>
  </defs>
  <text x="0" y="55" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="38px" letter-spacing="2px" fill="url(#darkPrism)">
    BASIC
  </text>
</svg>
