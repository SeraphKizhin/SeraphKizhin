<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180">
  <defs>
    <!-- Light Prism Gradient for the Header -->
    <linearGradient id="prismText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084f5">
        <animate attributeName="stop-color" values="#c084f5; #a0d4ff; #f0ffb0; #ffb0c8; #c084f5" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a0d4ff">
        <animate attributeName="stop-color" values="#a0d4ff; #f0ffb0; #ffb0c8; #c084f5; #a0d4ff" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084f5">
        <animate attributeName="stop-color" values="#c084f5; #a0d4ff; #f0ffb0; #ffb0c8; #c084f5" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- Glass Panel Dark Background with subtle border -->
  <rect width="100%" height="100%" fill="#0a0a0f" rx="15" stroke="#2a2a35" stroke-width="2"/>

  <!-- Animated Prism Header -->
  <text x="40" y="55" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="28px" letter-spacing="2px" fill="url(#prismText)">
    ABOUT ME
  </text>
</svg>
