<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="800" height="100">
  <defs>
    <!-- Dark Mode Gold Refractive Gradient -->
    <linearGradient id="darkPrism" x1="0%" y1="50%" x2="100%" y2="50%">
      
      <!-- Left side -->
      <stop offset="0%" stop-color="#b06800">
        <animate attributeName="stop-color" 
                 values="#b06800; #ffd700; #fff4b0; #e8a800; #b06800" 
                 dur="4s" repeatCount="indefinite" />
      </stop>

      <!-- Middle (offset to create the shifting shimmer) -->
      <stop offset="50%" stop-color="#fff4b0">
        <animate attributeName="stop-color" 
                 values="#fff4b0; #e8a800; #b06800; #ffd700; #fff4b0" 
                 dur="4s" repeatCount="indefinite" />
      </stop>

      <!-- Right side -->
      <stop offset="100%" stop-color="#b06800">
        <animate attributeName="stop-color" 
                 values="#b06800; #ffd700; #fff4b0; #e8a800; #b06800" 
                 dur="4s" repeatCount="indefinite" />
      </stop>
      
    </linearGradient>
  </defs>

  <!-- The Text -->
  <text x="50%" y="55%" 
        dominant-baseline="middle" 
        text-anchor="middle" 
        font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" 
        font-weight="900" 
        font-size="42px" 
        letter-spacing="1px"
        fill="url(#darkPrism)">
    Light that Burns the Sky
  </text>
</svg>
